<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cleaning Kit | Locoshine</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

.cleaning-page{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:120px 20px;
background:#0f0f0f;
}

.cleaning-box{
max-width:700px;
background:#181818;
border:1px solid rgba(255,255,255,0.05);
padding:60px 35px;
border-radius:35px;
text-align:center;
position:relative;
overflow:hidden;
}

.cleaning-box::before{
content:'';
position:absolute;
width:250px;
height:250px;
background:#ff3c00;
filter:blur(120px);
top:-100px;
right:-100px;
opacity:0.4;
}

.cleaning-box h1{
font-size:50px;
margin-bottom:20px;
position:relative;
z-index:2;
}

.cleaning-box p{
color:#cfcfcf;
line-height:1.9;
margin-bottom:35px;
position:relative;
z-index:2;
}

.cleaning-badge{
display:inline-block;
padding:10px 20px;
background:white;
color:black;
border-radius:50px;
font-size:13px;
font-weight:700;
margin-bottom:25px;
position:relative;
z-index:2;
}

.home-btn{
padding:15px 35px;
border:none;
border-radius:50px;
background:#ff3c00;
color:white;
font-weight:600;
font-size:15px;
cursor:pointer;
position:relative;
z-index:2;
}

@media(max-width:768px){

.cleaning-box h1{
font-size:36px;
}

}

</style>

</head>

<body>

<header class="navbar">

<div class="logo">
LOCO<span>SHINE</span>
</div>

</header>

<section class="cleaning-page">

<div class="cleaning-box">

<div class="cleaning-badge">
COMING SOON
</div>

<h1>
Premium Cleaning Kits Launching Soon
</h1>

<p>
Professional car cleaning kits with premium accessories and detailing tools are arriving soon for car lovers.
</p>

<a href="index.html">

<button class="home-btn">
Back To Home
</button>

</a>

</div>

</section>

</body>

</html>
