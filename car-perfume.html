<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Car Perfume | Locoshine</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

.perfume-page{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:120px 20px;
background:linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.9)),
url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1600&auto=format&fit=crop');
background-size:cover;
background-position:center;
}

.perfume-box{
max-width:650px;
background:rgba(24,24,24,0.9);
padding:50px 35px;
border-radius:30px;
text-align:center;
backdrop-filter:blur(10px);
}

.perfume-box h1{
font-size:52px;
margin-bottom:20px;
}

.perfume-box p{
color:#d4d4d4;
line-height:1.9;
margin-bottom:35px;
}

.perfume-tag{
display:inline-block;
padding:10px 20px;
background:#ff3c00;
border-radius:50px;
font-size:13px;
font-weight:600;
margin-bottom:25px;
}

.home-btn{
padding:15px 35px;
border:none;
border-radius:50px;
background:#ff3c00;
color:white;
font-weight:600;
font-size:15px;
cursor:pointer;
}

@media(max-width:768px){

.perfume-box h1{
font-size:38px;
}

}

</style>

</head>

<body>

<header class="navbar">

<div class="logo">
LOCO<span>SHINE</span>
</div>

</header>

<section class="perfume-page">

<div class="perfume-box">

<div class="perfume-tag">
PREMIUM COLLECTION
</div>

<h1>
Luxury Car Perfumes Coming Soon
</h1>

<p>
Exclusive premium car perfumes with luxury fragrance and elegant bottle designs are arriving soon at Locoshine.
</p>

<a href="index.html">

<button class="home-btn">
Back To Home
</button>

</a>

</div>

</section>

</body>

</html>>
